# Local OpenTelemetry Collector — forwards the app's OTLP telemetry to
# Splunk Observability Cloud.
#   metrics -> signalfx exporter. send_otlp_histograms:true is required so the
#              GenAI histograms AI Agent Monitoring relies on (e.g.
#              gen_ai.evaluation.score, token-usage histograms) are ingested.
#   traces  -> Splunk APM via the OTLP/HTTP trace ingest endpoint.
# Realm + token come from the container environment (SPLUNK_REALM /
# O11Y_INGEST), injected by run-collector.sh from .env.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Strip per-process resource attributes from METRICS only. Every app restart
  # changes process.pid/command_args, which minted a brand-new MTS identity set
  # per restart — cardinality churn that (a) needlessly multiplies MTS and
  # (b) left every restart needing NEW MTS creations, which the org's per-metric
  # cardinality protection has been refusing for gen_ai.client.* since
  # 2026-07-29 (sf.org.numLimitedMetricTimeSeriesCreateCalls). With these
  # stripped, the MTS identity is stable across restarts (service + host +
  # datapoint attrs), so after the first successful creation restarts reuse the
  # same series. Traces are untouched — span storage has no MTS cardinality.
  transform/metrics_slim:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - delete_matching_keys(attributes, "^process\\..+")
          - delete_key(attributes, "service.instance.id")
  # Galileo only ingests GenAI spans. Drop everything else (FastAPI HTTP
  # server/client spans) before the Galileo exporter so they don't trigger
  # Galileo's "No GenAI patterns detected in spans" partial-success drops. Keeps
  # only spans carrying gen_ai.operation.name (workflow / invoke_agent / chat).
  # Splunk APM still receives the full trace via the separate traces pipeline.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - 'attributes["gen_ai.operation.name"] == nil'
  # Keep ONLY the gen_ai histograms for the classic (flattened) fan-out below —
  # everything else already reaches o11y natively via the main metrics pipeline
  # and must not be double-exported.
  filter/genai_hist_only:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^gen_ai\\.(client\\.(token\\.usage|operation\\.duration)|agent\\.duration)$")'

exporters:
  signalfx:
    access_token: "${env:O11Y_INGEST}"
    realm: "${env:SPLUNK_REALM}"
    send_otlp_histograms: true
  # Classic-mode fan-out for the gen_ai histograms ONLY (see filter above).
  # The org's cardinality limiter has been refusing NEW native-histogram MTS for
  # gen_ai.client.* since 2026-07-29 while classic flattened series
  # (_bucket/_count/_sum/_min/_max) still create freely — the k8s workshop
  # stacks mint them continuously. This leg stores our token/duration data in
  # that flattened form under distinct metric names, so it survives the freeze
  # and stays chartable; the native leg above keeps sending so data resumes
  # under the bare names the moment the limiter is lifted. Remove this exporter
  # + its pipeline once native creation works again.
  signalfx/classic:
    access_token: "${env:O11Y_INGEST}"
    realm: "${env:SPLUNK_REALM}"
  otlphttp/traces:
    traces_endpoint: "https://ingest.${env:SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      X-SF-Token: "${env:O11Y_INGEST}"
  # The Galileo (LLM observability) fan-out lives in otel-collector-galileo.yaml
  # and is layered on by run-collector.sh with a second --config flag, ONLY when
  # GALILEO_API_KEY is set. Keeping it out of this file is what makes it a real
  # no-op on a keyless deployment instead of POSTing span content with an empty
  # API-key header.

service:
  pipelines:
    # Splunk APM: full traces (HTTP + GenAI spans).
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    # traces/galileo is defined in otel-collector-galileo.yaml (layered on only
    # when GALILEO_API_KEY is set — see the exporters note above).
    metrics:
      receivers: [otlp]
      processors: [transform/metrics_slim, batch]
      exporters: [signalfx]
    # gen_ai histograms additionally in classic flattened form (see
    # signalfx/classic note). Same slim resource shape.
    metrics/genai_classic:
      receivers: [otlp]
      processors: [transform/metrics_slim, filter/genai_hist_only, batch]
      exporters: [signalfx/classic]
  telemetry:
    logs:
      level: info
