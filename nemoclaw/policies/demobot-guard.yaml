# NemoClaw network-policy preset: let the sandboxed OpenClaw reach DemoBot's
# governance seat, and nothing else. Applied by run-nemoclaw.sh with
#   nemoclaw <sandbox> policy add --from-file <this file, host substituted> \
#       --trusted-private-host <DEMOBOT_HOST>
#
# Schema: the `preset:` header + a `network_policies` map, the shape NemoClaw's
# own presets use (nemoclaw-blueprint/policies/presets/*.yaml). The 4.2.0 file
# predated it and was rejected with "Preset must declare preset.name", so the
# sandbox could never reach the guard (seen on EC2, 2026-09-02).
#
# Host: a user-supplied preset may target a PRIVATE IP LITERAL only, and only
# when `--trusted-private-host <that ip>` is passed — NemoClaw then pins the
# address itself. Its validator refuses loopback (inside the sandbox 127.0.0.1
# is the sandbox), refuses its managed aliases (host.openshell.internal,
# host.docker.internal) for user presets, and refuses `allowed_ips` in a
# user-supplied file. So run-nemoclaw.sh substitutes __DEMOBOT_HOST__ with this
# host's private IP (hostname -I / ipconfig getifaddr en0) and trusts it.
preset:
  name: demobot-guard
  description: "DemoBot governance seat: the tool guard on the host, port 8001"

network_policies:
  demobot-guard:
    name: demobot-guard
    endpoints:
      - host: __DEMOBOT_HOST__
        port: 8001
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/api/toolguard/**" }
          - allow: { method: GET, path: "/api/toolguard/**" }
          - allow: { method: GET, path: "/health" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
